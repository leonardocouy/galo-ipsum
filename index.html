<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galo Ipsum - Gerador de Placeholder Galoista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 3px solid #ffffff;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .rooster {
            margin-bottom: 10px;
        }

        .rooster img {
            width: 150px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .subtitle {
            font-size: 1.2em;
            color: #cccccc;
            margin-top: 10px;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1.1em;
        }

        label input[type="checkbox"] {
            margin-right: 8px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 2px solid #ffffff;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button img.btn-logo {
            width: 30px;
            height: auto;
        }

        button:hover {
            background: #cccccc;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .output {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 10px;
            min-height: 200px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .output p {
            margin-bottom: 20px;
            line-height: 1.8;
            text-align: justify;
        }

        .output .hino {
            white-space: pre-line;
            font-weight: bold;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            font-style: italic;
            color: #cccccc;
        }

        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            color: #999999;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .rooster img {
                width: 100px;
            }

            button img.btn-logo {
                width: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="rooster"><img src="logo.png" alt="Galo Logo"></div>
            <h1>GALO IPSUM</h1>
            <p class="subtitle">Gerador de placeholder text galoista raiz!</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="paragraphs">Número de Parágrafos:</label>
                <input type="number" id="paragraphs" min="1" max="50" value="5">
            </div>

            <div class="control-group">
                <label for="type">Tamanho dos Parágrafos:</label>
                <select id="type">
                    <option value="short">Short (3 sentenças)</option>
                    <option value="medium" selected>Medium (7 sentenças)</option>
                    <option value="long">Long (12 sentenças)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="rewrite">
                    <input type="checkbox" id="rewrite" checked>
                    Gerar com IA
                </label>
            </div>

            <button onclick="generateIpsum()"><img src="logo.png" alt="Galo" class="btn-logo"> GERAR GALO IPSUM!</button>
        </div>

        <div class="output" id="output">
            <p class="loading">Clique no botão acima para gerar seu Galo Ipsum!</p>
        </div>

        <footer>
            <p>🐓 Galo Doido - Uma vez Galo, sempre Galo! ⚫⚪</p>
            <p>Feito com raça e amor pela Massa Atleticana</p>
        </footer>
    </div>

    <script type="module">
        let knowledgeBase = null;
        const MODEL_NAME = "Qwen2-0.5B-Instruct-q4f16_1-MLC";
        let mlcEngine = null;
        let mlcEnginePromise = null;

        const HINO_GALO = `NÓS SOMOS DO CLUBE ATLÉTICO MINEIRO
JOGAMOS COM MUITA RAÇA E AMOR
VIBRAMOS COM ALEGRIA NAS VITÓRIAS
CLUBE ATLÉTICO MINEIRO
GALO FORTE VINGADOR

VENCER, VENCER, VENCER
ESTE É O NOSSO IDEAL
HONRAMOS O NOME DE MINAS
NO CENÁRIO ESPORTIVO MUNDIAL

LUTAR, LUTAR, LUTAR
PELOS GRAMADOS DO MUNDO PRA VENCER
CLUBE ATLÉTICO MINEIRO
UMA VEZ ATÉ MORRER

NÓS SOMOS CAMPEÕES DO GELO
O NOSSO TIME É IMORTAL
NÓS SOMOS CAMPEÕES DOS CAMPEÕES
SOMOS O ORGULHO DO ESPORTE NACIONAL

LUTAR, LUTAR, LUTAR
COM TODA NOSSA RAÇA PRA VENCER
CLUBE ATLÉTICO MINEIRO
UMA VEZ ATÉ MORRER
CLUBE ATLÉTICO MINEIRO
UMA VEZ ATÉ MORRER

NÓS SOMOS CAMPEÕES DO GELO
O NOSSO TIME É IMORTAL
NÓS SOMOS CAMPEÕES DOS CAMPEÕES
SOMOS O ORGULHO DO ESPORTE NACIONAL

LUTAR, LUTAR, LUTAR
COM TODA NOSSA RAÇA PRA VENCER
CLUBE ATLÉTICO MINEIRO
UMA VEZ ATÉ MORRER
CLUBE ATLÉTICO MINEIRO
UMA VEZ ATÉ MORRER`;

        const PONTUACOES = ['!', '.', '...', '!!'];
        const VERBOS_ACAO = [
            'vai',
            'resolve',
            'parte para',
            'corre para',
            'chega para',
            'dispara para'
        ];

        const SENTENCE_TEMPLATES = [
            {
                build: (d) => `${d.grito} ${d.lenda} ${d.acao} ${localComArtigo(d.local)}${d.pont}`
            },
            {
                build: (d) =>
                    `${capitalize(localComArtigo(d.local))}, ${d.lenda} ${d.acao} e a Massa responde: "${d.grito}"${d.pont}`
            },
            {
                build: (d) =>
                    `Quando ${d.lenda} ${d.acao}, ${d.grito} ecoa ${localComArtigo(d.local)}${d.pont}`
            },
            {
                build: (d) => `${d.lenda} ${d.acao} - ${d.grito}${d.pont}`
            },
            {
                build: (d) =>
                    `Entre um canto e outro, "${d.meme}". ${d.lenda} ${d.acao} ${localComArtigo(d.local)}${d.pont}`,
                requiresMeme: true
            },
            {
                build: (d) =>
                    `${capitalize(localComArtigo(d.local))} a Massa puxa o coro: ${d.grito}. ${d.lenda} ${d.acao}${d.pont}`
            }
        ];

        async function loadKnowledgeBase() {
            if (knowledgeBase) return knowledgeBase;

            try {
                const response = await fetch('galo_knowledge_base.json');
                knowledgeBase = await response.json();
                return knowledgeBase;
            } catch (error) {
                throw new Error('Erro ao carregar knowledge base: ' + error.message);
            }
        }

        function randomPick(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function pickDifferent(array, lastValue) {
            if (!array || array.length === 0) return '';
            if (!lastValue || array.length === 1) return randomPick(array);

            let pick = randomPick(array);
            let tries = 0;
            while (pick === lastValue && tries < 5) {
                pick = randomPick(array);
                tries += 1;
            }

            return pick;
        }

        function stripTrailingPunctuation(text) {
            if (!text) return '';
            return text.replace(/[.!?]+$/, '');
        }

        function formatAction(action) {
            if (!action) return '';
            return action.replace(/_/g, ' ');
        }

        function buildActionPhrase(action) {
            const actionText = formatAction(action);
            if (!actionText) return '';

            if (actionText.endsWith('ando') || actionText.endsWith('endo') || actionText.endsWith('indo')) {
                return `tá ${actionText}`;
            }

            return `${randomPick(VERBOS_ACAO)} ${actionText}`;
        }

        function localComArtigo(local) {
            if (!local) return '';
            const lower = local.toLowerCase();
            if (
                lower.startsWith('arena') ||
                lower.startsWith('sede') ||
                lower.startsWith('praça') ||
                lower.startsWith('serra') ||
                lower.startsWith('esplanada') ||
                lower.startsWith('pampulha')
            ) {
                return `na ${local}`;
            }
            if (lower.startsWith('arredores')) {
                return `nos ${local}`;
            }
            return `no ${local}`;
        }

        function capitalize(text) {
            if (!text) return '';
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        async function getTextEngine() {
            if (mlcEngine) return mlcEngine;
            if (!mlcEnginePromise) {
                mlcEnginePromise = (async () => {
                    const webllm = await import("https://esm.run/@mlc-ai/web-llm");
                    return webllm.CreateMLCEngine(MODEL_NAME, {
                        initProgressCallback: (p) => console.log(p.text || p.progress)
                    });
                })();
            }
            mlcEngine = await mlcEnginePromise;
            return mlcEngine;
        }

        function buildKnowledgeBasePrompt(kb, numParagraphs, numSentences) {
            const kbJson = JSON.stringify(kb);
            return [
                "Voce e um gerador de lero-lero galoista.",
                `Gere exatamente ${numParagraphs} paragrafos com ${numSentences} frases por paragrafo.`,
                "Cada frase deve conter pelo menos: um grito_de_guerra, uma legenda e uma acao_do_mascote.",
                "Quando fizer sentido, inclua um local_sagrado ou um meme_classico.",
                "Use APENAS termos presentes na base de conhecimento para nomes, acoes, gritos, memes e locais.",
                "Conectores simples em pt-BR estao liberados (ex: 'e', 'mas', 'quando', 'no', 'na', 'com').",
                "Nao invente nomes, fatos ou referencias fora da base.",
                "Separe paragrafos com uma linha em branco e nao adicione explicacoes.",
                "Base de conhecimento (JSON):",
                kbJson
            ].join("\n");
        }

        async function gerarComIA(numParagraphs, numSentences, kb) {
            const prompt = buildKnowledgeBasePrompt(kb, numParagraphs, numSentences);
            const engine = await getTextEngine();
            const res = await engine.chat.completions.create({
                messages: [{ role: "user", content: prompt }],
                temperature: 0.9,
                max_tokens: Math.min(220 * numParagraphs, 1200)
            });
            const content = res && res.choices && res.choices[0] && res.choices[0].message
                ? res.choices[0].message.content
                : '';
            return content ? content.trim() : '';
        }

        function splitParagraphs(text) {
            return text
                .split(/\n\s*\n+/)
                .map((p) => p.trim())
                .filter(Boolean);
        }

        function generateSentence(kb, state) {
            const gritos = kb.gritos_de_guerra.items;
            const lendas = kb.legendas.items;
            const acoes = kb.acoes_do_mascote.items;
            const locais = kb.locais_sagrados ? kb.locais_sagrados.items : ['Horto'];
            const memes = kb.memes_classicos ? kb.memes_classicos.items : [];

            const gritoRaw = pickDifferent(gritos, state.lastGrito);
            state.lastGrito = gritoRaw;

            const useAnchorLenda = state.anchorLenda && Math.random() < 0.35;
            const lenda = useAnchorLenda ? state.anchorLenda : pickDifferent(lendas, state.lastLenda);
            state.lastLenda = lenda;

            const useAnchorLocal = state.anchorLocal && Math.random() < 0.35;
            const local = useAnchorLocal ? state.anchorLocal : pickDifferent(locais, state.lastLocal);
            state.lastLocal = local;

            const acaoRaw = pickDifferent(acoes, state.lastAcao);
            state.lastAcao = acaoRaw;

            const useMeme = memes && memes.length > 0 && Math.random() < 0.2;
            const meme = useMeme ? pickDifferent(memes, state.lastMeme) : '';
            state.lastMeme = meme || state.lastMeme;

            const data = {
                grito: stripTrailingPunctuation(gritoRaw),
                gritoRaw,
                lenda,
                acao: buildActionPhrase(acaoRaw),
                local,
                meme,
                pont: randomPick(PONTUACOES)
            };

            const availableTemplates = SENTENCE_TEMPLATES.filter((t) => !t.requiresMeme || data.meme);
            return randomPick(availableTemplates).build(data);
        }

        function generateParagraph(type, kb) {
            const sentenceCounts = {
                short: 3,
                medium: 7,
                long: 12
            };

            const numSentences = sentenceCounts[type] || sentenceCounts.medium;
            const sentences = [];
            const state = {
                lastGrito: null,
                lastLenda: null,
                lastAcao: null,
                lastLocal: null,
                lastMeme: null,
                anchorLenda: randomPick(kb.legendas.items),
                anchorLocal: randomPick(kb.locais_sagrados ? kb.locais_sagrados.items : ['Horto'])
            };

            for (let i = 0; i < numSentences; i++) {
                sentences.push(generateSentence(kb, state));
            }

            return sentences.join(' ');
        }

        async function generateIpsum() {
            const output = document.getElementById('output');
            const paragraphsInput = document.getElementById('paragraphs');
            const typeInput = document.getElementById('type');
            const rewriteInput = document.getElementById('rewrite');

            const numParagraphs = parseInt(paragraphsInput.value);
            const type = typeInput.value;
            const shouldRewrite = rewriteInput ? rewriteInput.checked : false;
            const sentenceCounts = {
                short: 3,
                medium: 7,
                long: 12
            };
            const numSentences = sentenceCounts[type] || sentenceCounts.medium;

            if (isNaN(numParagraphs) || numParagraphs <= 0) {
                output.innerHTML = '<p class="error">Erro: Digite um número válido de parágrafos!</p>';
                return;
            }

            output.innerHTML = shouldRewrite
                ? '<p class="loading">Carregando o modelo e gerando o texto... 🐓</p>'
                : '<p class="loading">Gerando seu Galo Ipsum raiz... 🐓</p>';

            try {
                const kb = await loadKnowledgeBase();
                let html = '';
                let aiParagraphs = [];

                if (shouldRewrite) {
                    const nonHinoCount = numParagraphs - Math.floor(numParagraphs / 10);
                    try {
                        const aiText = await gerarComIA(nonHinoCount, numSentences, kb);
                        aiParagraphs = splitParagraphs(aiText).slice(0, nonHinoCount);
                    } catch (error) {
                        console.warn('Falha ao gerar com IA:', error);
                    }
                }

                for (let i = 1; i <= numParagraphs; i++) {
                    if (i % 10 === 0) {
                        html += `<div class="hino">${HINO_GALO}</div>`;
                    } else {
                        let paragraph = aiParagraphs.length > 0
                            ? aiParagraphs.shift()
                            : generateParagraph(type, kb);
                        html += `<p>${paragraph}</p>`;
                    }
                }

                output.innerHTML = html;
            } catch (error) {
                output.innerHTML = `<p class="error">${error.message}</p>`;
            }
        }

        // Carregar knowledge base ao iniciar
        loadKnowledgeBase().catch(error => {
            console.error('Erro ao carregar knowledge base:', error);
        });

        window.generateIpsum = generateIpsum;
    </script>
</body>
</html>
